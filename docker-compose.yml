services:
  db:
    image: postgres:17-alpine
    container_name: folego-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: folego
      POSTGRES_PASSWORD: folego
      POSTGRES_DB: folego
    ports:
      - "5432:5432"
    volumes:
      - folego-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folego -d folego"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  folego-db-data:
